<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Background & Accent Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="0.8" fill="#38bdf8" fill-opacity="0.18"/>
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); opacity: 0.9; }
        50% { filter: drop-shadow(0 0 22px rgba(168, 85, 247, 0.8)); opacity: 1; }
      }
      @keyframes scanMotion {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { opacity: 0.7; }
        100% { transform: translateY(260px); opacity: 0.15; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes beaconWave {
        0% { r: 8px; opacity: 0.85; stroke-width: 2px; }
        100% { r: 40px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes checkPop {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }

      .pulse-shield { animation: pulseGlow 4s infinite ease-in-out; }
      .radar-sweep { transform-origin: 105px 130px; animation: radarSweep 8s infinite linear; }
      .scanner-beam { animation: scanMotion 5.5s infinite linear; }
      .circuit-stream { stroke-dasharray: 8, 8; animation: dashFlow 5s infinite linear; }
      .float-card-1 { animation: floatCard1 4s infinite ease-in-out; }
      .float-card-2 { animation: floatCard2 5s infinite ease-in-out 1s; }
      .beacon-ring { animation: beaconWave 2.8s infinite cubic-bezier(0.1, 0.7, 0.5, 1); }
      .check-pulse { animation: checkPop 3s infinite ease-in-out; transform-origin: center; }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
    </style>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="920" height="260" fill="url(#bgGrad)" rx="16"/>
  <rect width="920" height="260" fill="url(#cyberGrid)" rx="16"/>

  <!-- 2. Dynamic Scanning Light Line (Behind content) -->
  <rect class="scanner-beam" x="0" y="0" width="920" height="2" fill="url(#scanGrad)" opacity="0.4"/>

  <!-- 3. Dynamic Connecting Circuit / Flow Lines (Behind text) -->
  <path class="circuit-stream" d="M 105 130 L 220 130 L 240 70 L 320 70" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <path class="circuit-stream" d="M 105 130 L 210 195 L 310 195" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.35"/>
  <path class="circuit-stream" d="M 720 100 L 760 100 L 780 70 L 880 70" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.3"/>
  <path class="circuit-stream" d="M 720 180 L 770 180 L 800 200 L 880 200" fill="none" stroke="#34d399" stroke-width="1.2" opacity="0.3"/>

  <!-- 4. Left Hero Visual: Security Radar + Shield + Dual-Admin Keys -->
  <g transform="translate(10, 0)">
    <!-- Radar concentric rings -->
    <circle cx="105" cy="130" r="82" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="4,4"/>
    <circle cx="105" cy="130" r="58" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="105" cy="130" r="34" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Dynamic Radar Beacon Expansion Wave -->
    <circle class="beacon-ring" cx="105" cy="130" r="8" fill="none" stroke="#38bdf8"/>

    <!-- Dynamic Rotating Radar Sweep Beam -->
    <g class="radar-sweep">
      <path d="M 105 130 L 187 130 A 82 82 0 0 0 105 48 Z" fill="url(#primaryGrad)" opacity="0.12"/>
      <line x1="105" y1="130" x2="187" y2="130" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Glowing Shield + Keyhole Visual -->
    <g class="pulse-shield" transform="translate(76, 96) scale(1.35)">
      <!-- Shield Outer Shape -->
      <path d="M 21.5 2 L 4 9 C 4 21 11.5 32 21.5 37 C 31.5 32 39 21 39 9 L 21.5 2 Z" fill="url(#primaryGrad)" opacity="0.95"/>
      <!-- Inner Shield Cutout -->
      <path d="M 21.5 5.2 L 7 11 C 7 20.5 12.8 29.5 21.5 33.6 C 30.2 29.5 36 20.5 36 11 L 21.5 5.2 Z" fill="#090d16" opacity="0.85"/>
      <!-- Dual Keyhole / Access Vault Symbol -->
      <circle cx="21.5" cy="16" r="3.2" fill="#38bdf8"/>
      <path d="M 20 18 L 23 18 L 24 25 L 19 25 Z" fill="#38bdf8"/>
      <line x1="21.5" y1="21" x2="23.5" y2="21" stroke="#090d16" stroke-width="1.2"/>
    </g>
  </g>

  <!-- 5. Foreground Content: Tagline, Title, Subtitle, Badges (Crisp & Foreground) -->
  <g transform="translate(230, 0)">
    <!-- Top Pill Tag: Security Badge -->
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="275" height="24" rx="12" fill="#171e33" stroke="#6366f1" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="12" cy="12" r="4" fill="#34d399"/>
      <text x="26" y="16.5" fill="#c7d2fe" font-size="11" class="badge-text">ENTERPRISE GOVERNANCE &amp; IAM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="94" fill="url(#accentGrad)" font-size="30" class="title-text">
      Role-Based Access Control
    </text>
    <text x="0" y="128" fill="#f8fafc" font-size="24" class="title-text">
      &amp; Multi-Admin Approval
    </text>

    <!-- Subtitle -->
    <text x="0" y="162" fill="#94a3b8" font-size="13.5" class="sub-text">
      Least Privilege • Separation of Duties • Governed Multi-Party Workflows
    </text>

    <!-- Feature Badges / Pills -->
    <g transform="translate(0, 190)">
      <!-- Pill 1: Multi-Admin Approval -->
      <rect x="0" y="0" width="138" height="28" rx="7" fill="#131b2e" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="69" y="18" fill="#7dd3fc" font-size="11" text-anchor="middle" class="badge-text">👥 Multi-Admin (N/M)</text>

      <!-- Pill 2: Granular RBAC -->
      <rect x="146" y="0" width="118" height="28" rx="7" fill="#131b2e" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="205" y="18" fill="#a5b4fc" font-size="11" text-anchor="middle" class="badge-text">🔐 Granular RBAC</text>

      <!-- Pill 3: Separation of Duties -->
      <rect x="272" y="0" width="132" height="28" rx="7" fill="#131b2e" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
      <text x="338" y="18" fill="#d8b4fe" font-size="11" text-anchor="middle" class="badge-text">⚖️ Separation of Duties</text>

      <!-- Pill 4: Open Source & SaaS -->
      <rect x="412" y="0" width="128" height="28" rx="7" fill="#131b2e" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
      <text x="476" y="18" fill="#6ee7b7" font-size="11" text-anchor="middle" class="badge-text">⚡ SaaS &amp; OSS Stack</text>
    </g>
  </g>

  <!-- 6. Right Visual: Dynamic Flow Cards (Multi-Admin Quorum Approval Simulation) -->
  <g transform="translate(755, 38)">
    <!-- Flow Card 1: Admin 1 Confirmed (Dynamic floating) -->
    <g class="float-card-1" transform="translate(0, 10)">
      <rect x="0" y="0" width="145" height="46" rx="8" fill="#111827" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.8" filter="url(#cardGlow)"/>
      <circle cx="20" cy="23" r="10" fill="url(#emeraldGrad)"/>
      <!-- Checkmark -->
      <path d="M 16 23 L 19 26 L 25 19" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="19" fill="#f3f4f6" font-size="10.5" class="badge-text">Admin A: Approved</text>
      <text x="36" y="32" fill="#34d399" font-size="9" class="sub-text">Quorum 1/2 verified</text>
    </g>

    <!-- Flow Connector Arrow -->
    <g transform="translate(68, 62)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <polygon points="-3,14 3,14 0,18" fill="#64748b"/>
    </g>

    <!-- Flow Card 2: Admin 2 Consensus (Dynamic floating with delay) -->
    <g class="float-card-2" transform="translate(0, 84)">
      <rect x="0" y="0" width="145" height="46" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" filter="url(#cardGlow)"/>
      <circle class="check-pulse" cx="20" cy="23" r="10" fill="url(#primaryGrad)"/>
      <!-- Lock Check -->
      <path d="M 16 23 L 19 26 L 25 19" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="19" fill="#f3f4f6" font-size="10.5" class="badge-text">Admin B: Approved</text>
      <text x="36" y="32" fill="#38bdf8" font-size="9" class="sub-text">Quorum 2/2 Complete</text>
    </g>

    <!-- Final Execution Pill -->
    <g transform="translate(10, 145)">
      <rect x="0" y="0" width="125" height="22" rx="11" fill="#042f2e" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.7"/>
      <circle cx="12" cy="11" r="3.5" fill="#2dd4bf"/>
      <text x="22" y="15" fill="#ccfbf1" font-size="9.5" class="badge-text">POLICY ENFORCED</text>
    </g>
  </g>

  <!-- 7. Outer Border Glow -->
  <rect x="1" y="1" width="918" height="258" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" rx="15" opacity="0.45"/>
</svg>